services:
  db:
    image: postgres:18
    container_name: petala-postgres
    environment:
      POSTGRES_USER: petala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petala
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - petala_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petala -d petala"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  petala_postgres_data:
